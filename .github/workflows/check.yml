name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env: { POSTGRES_USER: ri, POSTGRES_PASSWORD: ri, POSTGRES_DB: robotics_intelligence }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ri" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ri:ri@localhost:5432/robotics_intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate && pnpm seed && pnpm fixtures && pnpm check
      - run: git diff --exit-code -- packages/fixtures/generated || (echo "fixtures drifted; run pnpm fixtures" && exit 1)
