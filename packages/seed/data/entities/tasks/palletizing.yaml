slug: palletizing
entity_type: TASK
name: Palletizing
short_description: Stacking cases, bags or trays onto a pallet at the end of a production line, to a pattern and at line rate.
depth_tier: STANDARD
aliases: [End-of-line palletizing, Depalletizing]
claims:
  - predicate: BELONGS_TO_MARKET
    object: machine-tending
    evidence:
      - class: ANALYST
        confidence: HIGH
        assessment:
          rationale: End-of-line palletizing is bought by the plant that runs the line, not by the DC that later receives the pallet; the cell integrates with the conveyor and the line PLC.
          advance_criteria: ["Would move to Warehouse if the same equipment were primarily bought by DC operators."]
          reviewed_at: 2026-09-01
  - predicate: HAS_MATURITY
    enum: MATURE
    valid_from: 2026-09-01
    evidence:
      - class: ANALYST
        confidence: HIGH
        assessment:
          author: editorial
          rationale: "A box on a conveyor is the friendliest object in manufacturing: known geometry, known pose, known rate. Vendors quote guaranteed case rates, dozens of integrators compete, and cobot palletizers have pushed the price down to where a single line can justify one. Nothing here is a research question; the argument is footprint and price."
          advance_criteria:
            - Already at the top of the scale; mixed-SKU pattern building is the remaining frontier
          regress_criteria:
            - A shift to packaging formats that defeat vacuum and clamp tooling
          evidence_considered:
            - robotic-palletizing-cell:HAS_MATURITY
            - cobot-palletizer:HAS_MATURITY
          reviewed_at: 2026-09-01
  - predicate: HAS_INCUMBENT_PROCESS
    text: Operators lifting cases off a conveyor onto a pallet by hand, or a fixed mechanical layer palletizer built for one pattern.
    evidence:
      - class: ANALYST
        confidence: HIGH
        assessment:
          rationale: Manual palletizing is among the highest injury-rate jobs in a plant, and the mechanical alternative cannot change pattern without retooling — which is why the robot displaced both.
          advance_criteria: ["Stable."]
          reviewed_at: 2026-09-01
  - predicate: HAS_APPROACH
    object: robotic-palletizing-cell
    evidence:
      - class: ANALYST
        confidence: HIGH
        assessment:
          rationale: The dedicated arm cell is the volume default and sets the rate benchmark.
          advance_criteria: ["Stable."]
          reviewed_at: 2026-09-01
  - predicate: HAS_APPROACH
    object: cobot-palletizer
    evidence:
      - class: ANALYST
        confidence: HIGH
        assessment:
          rationale: The movable cobot palletizer opened this task to plants that cannot dedicate floor space or an integrator to one line.
          advance_criteria: ["Stable."]
          reviewed_at: 2026-09-01
  - predicate: HAS_TECHNICAL_REQUIREMENT
    text: Tooling that holds the actual package
    evidence:
      - class: ANALYST
        confidence: HIGH
        assessment:
          rationale: Vacuum works on a sealed case and fails on a shrink-wrapped bundle or a bag; the end effector, not the arm, decides whether a given plant's product can be palletized at all.
          advance_criteria: ["Would be relaxed by tooling that spans case, bag and tray without a change."]
          reviewed_at: 2026-09-01
  - predicate: HAS_TECHNICAL_REQUIREMENT
    text: Pattern generation for mixed SKUs
    evidence:
      - class: ANALYST
        confidence: MEDIUM
        assessment:
          rationale: Single-SKU patterns are solved. Building a stable mixed pallet from an arbitrary order is a packing problem plus a stability problem, and it is where the remaining engineering sits.
          advance_criteria: ["Would be satisfied by mixed-case pallets built at rate without human correction."]
          reviewed_at: 2026-09-01
  - predicate: HAS_CUSTOMER_TYPE
    text: Food and beverage producers
    evidence:
      - class: ANALYST
        confidence: HIGH
        assessment:
          rationale: High case volumes, hard washdown environments and severe manual-handling injury exposure make this the densest palletizing buyer.
          advance_criteria: ["Stable."]
          reviewed_at: 2026-09-01
  - predicate: HAS_CUSTOMER_TYPE
    text: CPG manufacturers
    evidence:
      - class: ANALYST
        confidence: HIGH
        assessment:
          rationale: Consumer goods lines run continuously with stable case formats, which is the best possible fit for a fixed palletizing cell.
          advance_criteria: ["Stable."]
          reviewed_at: 2026-09-01
  - predicate: HAS_ADOPTION_BLOCKER
    text: Floor space at the end of the line
    evidence:
      - class: ANALYST
        confidence: MEDIUM
        assessment:
          rationale: Plants were laid out before the cell existed, and the end of the line is the most congested place in the building. This is the single most common reason a justified palletizer does not get installed.
          advance_criteria:
            - Cells with a footprint small enough to drop in without moving the line
            - Vendors quoting installation without a plant layout change
          reviewed_at: 2026-09-01
  - predicate: HAS_ADOPTION_BLOCKER
    text: Package variability
    evidence:
      - class: ANALYST
        confidence: MEDIUM
        assessment:
          rationale: Marketing changes the pack format and the tooling stops working. The cell's lifetime is tied to a package design decision that the plant does not control.
          advance_criteria:
            - Tooling changes handled in-house within a shift
            - Cells requalified for a new pack format without vendor engineering
          reviewed_at: 2026-09-01
  - predicate: ADJACENT_TO
    object: pallet-movement
    evidence:
      - class: ANALYST
        confidence: HIGH
        assessment:
          rationale: The pallet the cell builds is the pallet the AMR moves; the handoff between the two is where plants discover their automation projects were scoped separately.
          advance_criteria: ["Stable."]
          reviewed_at: 2026-09-01
  - predicate: HAS_ECONOMICS_NOTE
    text: Payback is usually argued on injury and turnover as much as on headcount, because manual case stacking carries some of the highest recordable injury rates in a plant.
    evidence:
      - class: ANALYST
        confidence: MEDIUM
        assessment:
          rationale: Plants that only count hourly wages undervalue the cell; the insurance and absence line is often the larger number, though it varies enough by employer that it should not be quoted as a rule.
          advance_criteria: ["Would firm up with published customer injury-rate data before and after installation."]
          reviewed_at: 2026-09-01
