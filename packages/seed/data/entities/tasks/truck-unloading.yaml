          rationale: "Robotic trailer unloading runs at early customer sites for both palletised (autonomous forklift) and floor-loaded (arm-based) freight, but it is not routine: trailer condition, lighting and load variability make every trailer an edge case. Vendors report throughput on good trailers, not on the fleet average."
