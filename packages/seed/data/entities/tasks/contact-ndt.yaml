    enum: PILOT
    valid_from: 2026-09-01
    evidence:
      - class: ANALYST
        confidence: MEDIUM
        assessment:
          rationale: Crawler and suspended robots have carried ultrasonic probes in trials, but contact NDT on an installed blade needs consistent coupling on a curved surface at height, which no vendor sells routinely. It is a pilot task whose demand is real because subsurface defects are what visual inspection misses.
          advance_criteria:
            - A vendor offering NDT as a priced service, not a trial
            - Repeatable coupling quality demonstrated across blade types
            - Owner acceptance of robotic NDT reports for repair decisions
          evidence_considered:
