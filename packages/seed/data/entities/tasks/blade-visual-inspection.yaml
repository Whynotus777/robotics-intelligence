    enum: MATURE
    valid_from: 2026-09-01
    evidence:
      - class: ANALYST
        confidence: HIGH
        assessment:
          rationale: Drone-based blade inspection is standard practice across onshore and offshore fleets, sold as a routine service by multiple vendors with analytics attached. The incumbent (ground-based telephoto or rope access) is now the exception, which is the definition of a mature robotic task.
          advance_criteria:
            - Already at the top of the scale; watch for commoditisation of the service price
          regress_criteria:
