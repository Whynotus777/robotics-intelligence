    object: wind
    evidence:
      - class: ANALYST
        confidence: HIGH
        assessment:
          rationale: A wind O&M task performed on installed turbines by wind-sector buyers.
          advance_criteria: ["Would only change with a taxonomy redesign."]
          reviewed_at: 2026-09-01
