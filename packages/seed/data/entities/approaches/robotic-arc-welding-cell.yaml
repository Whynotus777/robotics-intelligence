claims:
  - predicate: HAS_MATURITY
    enum: MATURE
    valid_from: 2026-09-01
    evidence:
      - class: ANALYST
        confidence: HIGH
        assessment:
          rationale: Automotive has welded robotically for decades and the process is thoroughly characterised. What keeps the rest of the market manual is not welding physics but fixturing and programming cost, which scales with part variety, not with the number of robots.
          advance_criteria:
            - Already at the top of the scale for repeat-volume parts
          regress_criteria:
            - A shift to joining methods that robots handle less well than humans
          reviewed_at: 2026-09-01
