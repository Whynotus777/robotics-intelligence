name: Cobot tending cell
short_description: A collaborative arm parked at a machine door, loading and unloading blanks and finished parts without a fence.
depth_tier: STANDARD
claims:
  - predicate: HAS_MATURITY
    enum: MATURE
    valid_from: 2026-09-01
    evidence:
      - class: ANALYST
        confidence: HIGH
        assessment:
          rationale: Every major cobot vendor sells a packaged tending cell, integrators quote them from a photo of the machine, and the payback is arithmetic rather than argument. There is no open technical question here — the constraint is the customer's willingness to standardise fixturing.
          advance_criteria:
            - Already at the top of the scale; watch for price compression as Asian vendors take share
          regress_criteria:
            - A safety-standard change that reintroduces fencing around collaborative cells
