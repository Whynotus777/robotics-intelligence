# (embodiment, canonical layer) -> display label. `~` (null) means the layer does not apply
# to that embodiment and is omitted from the MRI. Keep all eleven canonical layers per embodiment.
HUMANOID:
  INTELLIGENCE: VLA / policy models
  PLANNING: Task planning
  PERCEPTION: Perception
  STATE_ESTIMATION: State estimation
  CONTROL: Whole-body control
  COMPUTE: Compute
  SENSORS: Cameras, depth, IMU, F/T
  ACTUATION: Joint actuators
  END_EFFECTOR_PAYLOAD: Hands / grippers
  POWER: Battery, BMS
  MECHANICAL: Frame, joints, legs
QUADRUPED:
  INTELLIGENCE: Mission autonomy
  PLANNING: Task & route planning
  PERCEPTION: Perception
  STATE_ESTIMATION: State estimation
  CONTROL: Locomotion control
  COMPUTE: Compute
  SENSORS: Cameras, depth, IMU
  ACTUATION: Leg actuators
  END_EFFECTOR_PAYLOAD: Payloads / arm
  POWER: Battery, BMS
  MECHANICAL: Frame, legs
DRONE:
  INTELLIGENCE: Mission autonomy
  PLANNING: Route & mission planning
  PERCEPTION: Perception / detection
  STATE_ESTIMATION: State estimation / EKF
  CONTROL: Flight control
  COMPUTE: Flight computer + companion compute
  SENSORS: Cameras, GNSS, IMU, LiDAR/radar
  ACTUATION: Motors, ESCs, propulsion
  END_EFFECTOR_PAYLOAD: Payload / gimbal / manipulator
  POWER: Battery / hybrid
  MECHANICAL: Airframe
AMR:
  INTELLIGENCE: Fleet orchestration
  PLANNING: Task & route planning
